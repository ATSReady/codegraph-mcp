[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codegraph-mcp"
version = "0.1.0"
description = "MCP server for structural and semantic code understanding"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=1.0.0",
    "click>=8.0",
    "pydantic>=2.0",
    "lancedb>=0.6.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-languages>=1.10.0",
    "onnxruntime>=1.17.0",
    "watchdog>=4.0.0",
    "tomli>=2.0;python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
codegraph = "codegraph.interface.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codegraph"]

[tool.hatch.build.targets.sdist]
include = ["src/codegraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
